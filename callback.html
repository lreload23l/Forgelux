<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing in…</title>
<style>
body{background:#080A0F;color:#fff;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;gap:1rem}
.spinner{width:32px;height:32px;border:3px solid rgba(123,47,255,.2);border-top-color:#7B2FFF;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{color:rgba(255,255,255,.5);font-size:13px;font-weight:300}
</style>
</head>
<body>
<div class="spinner"></div>
<p>Signing you in…</p>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(
  'https://xizckgqxdllbopsmbzis.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpemNrZ3F4ZGxsYm9wc21iemlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTE4NzIsImV4cCI6MjA5NjI2Nzg3Mn0.OkPjI4XGYiIbYO1Mf7DgVSkQrUfV__zZ1LinTnQjI28'
);

function buildUser(user) {
  return {
    id:         user.id,
    email:      user.email,
    name:       user.user_metadata?.full_name || user.email.split('@')[0],
    initials:   (user.user_metadata?.full_name || user.email).split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2),
    plan:       'Pro',
    role:       'Owner',
    workspace:  'My Workspace',
    runsUsed:   0,
    runsTotal:  50000,
    seatsUsed:  1,
    seatsTotal: 25,
  };
}

// Handle OAuth redirect tokens in URL hash
sb.auth.onAuthStateChange((event, session) => {
  if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session?.user) {
    sessionStorage.setItem('flx_user', JSON.stringify(buildUser(session.user)));
    window.location.replace('/dashboard');
  }
});

// Also check existing session
const { data: { session } } = await sb.auth.getSession();
if (session?.user) {
  sessionStorage.setItem('flx_user', JSON.stringify(buildUser(session.user)));
  window.location.replace('/dashboard');
}

// Fallback timeout
setTimeout(() => {
  document.querySelector('p').textContent = 'Taking longer than expected…';
  setTimeout(() => window.location.replace('/login'), 3000);
}, 8000);
</script>
</body>
</html>
